name: Deploy to GitHub Pages

on:
    push:
        branches: [master]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            # Third-party actions pinned to full commit SHAs (trailing tag
            # comments are informational); prevents tag-retargeting from
            # silently changing the action body between runs.
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  lfs: true

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

            - run: bun install --frozen-lockfile

            # polytonic.github.io is a GitHub Pages user site, so Pages serves
            # this artifact from the domain root at www.tinycranes.com.
            - run: bun run build -- --public-url /

            - name: Write CNAME into the artifact
              run: printf '%s\n' 'www.tinycranes.com' > dist/CNAME

            # SPA fallback: GitHub Pages serves 404.html for unknown paths,
            # which lets Mithril's router handle deep links on direct load.
            - name: Copy index.html to 404.html
              run: cp dist/index.html dist/404.html

            - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

            - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
              with:
                  path: dist

            - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
              id: deployment
