<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Deploy base. Defaults to "/" for custom-domain (root) deploys. The
         GitHub Pages workflow rewrites this to "/<repo>/" for project-page
         deploys so the SPA's router knows the URL prefix. The asset paths
         themselves are baked at build time via parcel's --public-url flag. -->
    <meta name="app-base" content="/">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://www.shadertoy.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Kevin Fung">
    <meta name="description" content="Software design and development. I build things.">
    <meta name="theme-color" content="#386B8C">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TinyCranes">
    <meta property="og:title" content="TinyCranes">
    <meta property="og:description" content="Software design and development. I build things.">
    <meta property="og:url" content="https://www.tinycranes.com">
    <meta property="og:image" content="https://www.tinycranes.com/avatar.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TinyCranes">
    <meta name="twitter:description" content="Software design and development. I build things.">
    <meta name="twitter:image" content="https://www.tinycranes.com/avatar.jpg">
    <title>TinyCranes</title>
    <!-- Canonical anchors search-index entries to the custom-domain origin
         even when the artifact is also reachable at the github.io subpath. -->
    <link rel="canonical" href="https://www.tinycranes.com">
    <link rel="alternate" type="application/rss+xml" title="TinyCranes RSS" href="https://www.tinycranes.com/feed.xml">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="app"></div>
    <script type="module" src="index.ts"></script>
</body>
</html>
